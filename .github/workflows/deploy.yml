# Sestaví web a nasadí ho na GitHub Pages.
# Běží při každém nahrání do main a jednou denně, aby se proběhlé akce
# přesunuly do části Proběhlo. Když sestavení nebo testy selžou, nic se
# nenasadí a web zůstane v poslední funkční verzi. Workflow nic necommituje.
name: Nasazení webu

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sestavení a testy
        run: npx eleventy && node --test "test/*.test.js"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
